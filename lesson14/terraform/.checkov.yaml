# Accepted findings for this learning lab (lesson 14: microservices behind CloudFront → API Gateway → internal ALB).
# Each is a deliberate cost/simplicity choice or a production gap described in the docs;
# remove a line when you close that gap so the scan guards it from then on.
# Run from lesson14/: uvx checkov --config-file terraform/.checkov.yaml -d terraform
framework:
  - terraform
compact: true
skip-check:
  # Internal ALB: reached only through the VPC Link on HTTP :80 inside the VPC; TLS ends at CloudFront and API Gateway
  - CKV_AWS_2    # HTTPS listener needs an ACM certificate and a domain
  - CKV_AWS_103  # TLS 1.2 policy only applies to HTTPS listeners
  - CKV2_AWS_20  # HTTP->HTTPS redirect needs an HTTPS listener first
  - CKV_AWS_378  # ALB->target HTTP stays inside the VPC
  - CKV_AWS_91   # ALB access logs need an extra S3 bucket; not kept for a lab
  - CKV_AWS_150  # ALB deletion protection would block terraform destroy of the lab
  # ECS and API Gateway logs
  - CKV_AWS_158  # Log groups use CloudWatch's default encryption, not a customer KMS key
  - CKV_AWS_338  # 7-day log retention keeps lab cost near zero
  # RDS (dev: cheap and disposable; protection and Multi-AZ are root variables)
  - CKV_AWS_293  # Dev disables deletion protection so destroy works; db_deletion_protection turns it on
  - CKV_AWS_157  # Multi-AZ doubles DB cost; multi_az input exists for production
  - CKV_AWS_118  # Enhanced monitoring adds cost and an IAM role
  - CKV_AWS_353  # Performance Insights not needed for a lab
  - CKV_AWS_129  # Postgres log export to CloudWatch not enabled (cost)
  - CKV2_AWS_30  # Query logging is a parameter-group change; out of scope
  - CKV_AWS_161  # Services log in with per-service roles whose passwords live in Secrets Manager, not IAM auth
  # ECR
  - CKV_AWS_136  # Repository uses AES256 by default, not a customer KMS key
  # VPC
  - CKV2_AWS_11  # VPC flow logs add cost; enable for production auditing
  - CKV_AWS_130  # Public subnets hold only the NAT gateway; every task, the ALB and RDS sit in private subnets
  # S3: bootstrap state bucket (versioned, private, TLS-only) and the private storefront/images buckets behind OAC
  - CKV_AWS_18   # Access logging needs a second bucket
  - CKV_AWS_144  # Cross-region replication is beyond a single-region lab
  - CKV_AWS_145  # SSE-S3 (AES256) instead of a customer KMS key
  - CKV2_AWS_62  # No event notifications are needed for state files, the storefront or images
  - CKV_AWS_21   # Storefront and images are re-uploaded from the repo; versioning would only keep stale copies
  - CKV2_AWS_61  # No lifecycle rules: the storefront and images buckets hold a few small, current objects
  # CloudFront (default *.cloudfront.net certificate, no custom domain)
  - CKV2_AWS_42  # A custom certificate needs a domain; the lab uses the default cloudfront.net certificate
  - CKV_AWS_174  # The default certificate cannot set a minimum TLS version; that needs a custom certificate
  - CKV_AWS_86   # Access logs need a logging bucket; API Gateway access logs cover the API path
  - CKV_AWS_310  # Origin failover needs a second origin per bucket; single-region lab
  - CKV_AWS_374  # No geo restriction: the storefront is meant to be reachable from anywhere
  - CKV2_AWS_32  # No response headers policy yet; add Managed-SecurityHeadersPolicy for production
  - CKV2_AWS_47  # The attached web ACL (separate waf module) has AWSManagedRulesKnownBadInputsRuleSet, which covers Log4j
  # WAF
  - CKV2_AWS_31  # WAF request logging needs a Firehose/log destination; CloudWatch metrics and the alarm are kept
  # API Gateway
  - CKV_AWS_309  # Register, login and product browsing are public by design; every other route uses the JWT authorizer
  # SNS (order events and the two ops topics)
  - CKV_AWS_26   # Encryption needs a customer KMS key whose policy admits CloudWatch alarms; not kept for a lab
  # Secrets Manager (origin-verify header value and the svc_* role passwords)
  - CKV_AWS_149  # Secrets use the AWS managed aws/secretsmanager key, not a customer KMS key
  - CKV2_AWS_57  # Static random values; rotation needs a rotation Lambda and a db-init re-run, out of scope
